---
name: CI

on:
  pull_request:
    types: ["opened", "synchronize"]

permissions:
  contents: read

jobs:
  lint-actions:
    uses: freedomofpress/actionslib/.github/workflows/lint-actions.yaml@main
    permissions:
      contents: read
      actions: read

  lint-shell:
    name: Lint:Shell
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false

    - name: Run shellcheck
      run: |
        shellcheck --severity=info \
          gen-client-keypair \
          gen-service-keypair \
          tor-entrypoint

  lint-containerfile:
    name: Lint:Containerfile
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false

    - name: Run hadolint
      uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387  # 3.5.0
      with:
        dockerfile: Containerfile
