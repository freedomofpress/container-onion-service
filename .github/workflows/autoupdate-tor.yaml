---
name: Autoupdate:Tor

on:
  # Allows job to be manually triggered
  workflow_dispatch:

  schedule:
    # "12:39 UTC on Monday and Wednesday"
    #
    # 12pm UTC translates to 10pm AEST and 8am EST. This means that this job will fire 
    # overnight from Monday -> Tuesday in Melbourne, and first thing in the morning on
    # Monday in New York. This works out so that everyone on the team can "wake up to" 
    # new update alerts without needing to deal with them in the middle of the work day. 
    # The 39min offset from the hour was chosen arbitrarily in response to the "periods 
    # of high activity" note documented here:
    #
    # https://docs.github.com/en/actions/writing-workflows/choosing-when-your-workflow-runs/events-that-trigger>

    - cron: 39 12 * * 1

env:
  DEFAULT_BRANCH: main
  LOCAL_VERSION_FILE: version-tor.txt
  TOR_GITLAB_API: https://gitlab.torproject.org/api/v4/projects/426
  TOR_GITLAB_CHANGELOG: https://gitlab.com/torproject/tor/-/blob/main/ChangeLog
  PR_TEMPLATE_TITLE: "[AutoBot] Update Tor to `{0}`"
  PR_TEMPLATE_BODY: |
    ### Update to Latest Tor Release

    > [!WARNING]
    > This PR is generated automatically. Review the changelog, inspect
    > the diff, and test the built image before merging.

    - Update Tor from `{0}` to `{1}`
    - [Changelog]({2})

    ### Testing and Review

    - [ ] Visual review
    - [ ] Review the [changelog]({2})
    - [ ] Test the application by building and running a test image

      ```bash
      podman build . \
        --tag localhost/onion-service \
        --build-arg VERSION_TOR=$(cat version-tor.txt) \
        --build-arg VERSION_DEBIAN=$(cat version-debian.txt)
      ```

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ env.DEFAULT_BRANCH }}
          persist-credentials: false
          sparse-checkout: |
            ${{ env.LOCAL_VERSION_FILE }}

      - name: Fetch latest tag
        id: latest
        run: |
          tor_tag=$(curl "$TOR_GITLAB_API/repository/tags" | jq -r '.[0].name')

          tor_version=$(echo "$tor_tag" | cut -d "-" -f 2)

          echo "version=$tor_version" >>$GITHUB_OUTPUT

          echo "Latest Tor version: $tor_version"

      - name: Fetch current version
        id: current
        run: |
          current=$(cat "$LOCAL_VERSION_FILE")

          echo "version=$current" >>$GITHUB_OUTPUT

          echo "Current Tor version: $current"

    outputs:
      current: ${{ steps.current.outputs.version }}
      latest: ${{ steps.latest.outputs.version }}
      needs-update: ${{ steps.latest.outputs.version != steps.current.outputs.version }}
      file: ${{ env.LOCAL_VERSION_FILE }}

  update:
    name: Update
    runs-on: ubuntu-latest
    needs:
      - check
    if: ${{ needs.check.outputs.needs-update != 'false' }}
    permissions:
      actions: read
      contents: write
      pull-requests: write
    env:
      BRANCH_NAME: autobot/tor-${{ needs.check.outputs.latest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ env.DEFAULT_BRANCH }}
          persist-credentials: true

      - name: Check for existing PR
        id: precheck
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing=$(gh pr list --json=number,author,headRefName \
            | jq -cM '.[] | select(.author.is_bot==true) | select(.headRefName=="'${BRANCH_NAME}'")')

          if [ -z "$existing" ]; then
            echo "No existing PR found for branch ${BRANCH_NAME}, proceeding"
            echo "proceed=true" >> $GITHUB_OUTPUT
          else
            echo "Found existing PR: #$(echo $existing | jq -cM '.number')"
            echo "proceed=false" >> $GITHUB_OUTPUT
          fi

      - name: Update configuration
        if: ${{ steps.precheck.outputs.proceed == 'true' }}
        env:
          LATEST: ${{ needs.check.outputs.latest }}
          VERSION_FILE: ${{ needs.check.outputs.file }}
        run: |
          echo "$LATEST" >"$VERSION_FILE"

      - name: Commit configuration
        if: ${{ steps.precheck.outputs.proceed == 'true' }}
        uses: freedomofpress/actionslib/act/signed-commit@main
        with:
          create-branch: ${{ env.BRANCH_NAME }}
          files: |
            ${{ needs.check.outputs.file }}
          message: |
            (autobot) Update Tor from ${{ needs.check.outputs.current }} to ${{ needs.check.outputs.latest }}

            Changelog: ${{ env.TOR_GITLAB_CHANGELOG }}
          gpg-key: ${{ secrets.FPF_INFRABOT_GPG_KEY }}
          gpg-identity: ${{ vars.FPF_INFRABOT_GPG_IDENTITY }}
          gpg-email: ${{ vars.FPF_INFRABOT_GPG_EMAIL }}

      - name: Open pull request
        if: ${{ steps.precheck.outputs.proceed == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_TITLE: ${{ format(env.PR_TEMPLATE_TITLE, needs.check.outputs.latest)}}
          PR_BODY: ${{ format(env.PR_TEMPLATE_BODY, needs.check.outputs.current, needs.check.outputs.latest, env.TOR_GITLAB_CHANGELOG) }}
        run: |
          gh pr create \
          --head="${BRANCH_NAME}" \
          --base="${DEFAULT_BRANCH}" \
          --body="${PR_BODY}" \
          --title="${PR_TITLE}"
